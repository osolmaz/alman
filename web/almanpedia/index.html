<!doctype html>
<html lang="de" data-text-size="standard" data-color-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Almanpedia — Die freie Enzyklopädie, amtlich vereinfacht</title>
    <meta
      name="description"
      content="Almanpedia übersetzt Artikel der deutschsprachigen Wikipedia in Alman, einen konstruierten Dialekt des Deutschen ohne grammatisches Geschlecht. Die Übersetzung läuft vollständig im Browser."
    />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem("almanpedia:reader-settings:v1"));
        if (settings?.version === 1) {
          if (["small", "standard", "large"].includes(settings.textSize)) {
            document.documentElement.dataset.textSize = settings.textSize;
          }
          if (["auto", "light", "dark"].includes(settings.colorMode)) {
            document.documentElement.dataset.colorMode = settings.colorMode;
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
