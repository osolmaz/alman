# Model registry for standardized almanbench runs.
#
# One profile per reproducible configuration: the Inspect model string,
# provider environment, generation config, concurrency, and observed pricing
# (USD per million tokens, with the date it was read from the provider).
# Run a profile with:
#
#     uv run bench-run <profile>
#
# Routing follows Inspect model strings. `openai/...` uses Inspect's native
# provider; `anthropic-http/...` uses the harness's dependency-free Messages
# API adapter. Any OpenAI-compatible endpoint (Hugging Face router, dedicated
# Inference Endpoints, local servers) uses
# `openai-api/<service>/<model>` with `<SERVICE>_BASE_URL` and
# `<SERVICE>_API_KEY` from the profile env; `${VAR}` values are read from the
# ambient environment at run time.

defaults:
  max_connections: 8

profiles:
  gpt-5.5-xhigh:
    label: GPT-5.5 xhigh
    platform: openai-api
    model: openai/gpt-5.5
    generate:
      reasoning_effort: xhigh
      max_tokens: 16384
      # GPT-5.5 only supports the 24-hour prompt-cache retention policy.
      # Keeping the full specification in the stable system prefix lets all
      # benchmark rows reuse the same cached tokens.
      extra_body:
        prompt_cache_key: almanbench-public
        prompt_cache_retention: 24h
    pricing:
      uncached_input_per_million_tokens: 5.0
      cached_input_per_million_tokens: 0.5
      output_per_million_tokens: 30.0
      observed: 2026-07-18

